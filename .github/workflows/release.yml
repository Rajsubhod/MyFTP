name: Build and Release Executable

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev

      - name: Build project
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Verify executable exists
        run: |
          if [ ! -f build/my_ftp_server ]; then
            echo "Executable not found: build/my_ftp_server"
            exit 1
          fi  

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Release v1.${{ github.run_number }}
          files: build/my_ftp_server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}